name: Build portable EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run test suite (Windows 11)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  build:
    name: Build AgentsPulse.exe (Windows 11)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentsPulse-portable
          path: dist/AgentsPulse.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AgentsPulse-portable
          path: dist

      - name: Generate checksums
        run: (cd dist && sha256sum AgentsPulse.exe > SHA256SUMS.txt)

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for version $version - add one under a '## [$version] - YYYY-MM-DD' heading before tagging." >&2
            exit 1
          fi
          previous_tag=$(git tag --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -1)
          {
            echo ""
            if [ -n "$previous_tag" ]; then
              echo "[Full changelog](https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME})"
            fi
            echo "[README for this version](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md)"
          } >> release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgentsPulse.exe
            dist/SHA256SUMS.txt
          body_path: release_notes.md
